site_name: "건물 공사업자 매뉴얼"
docs_dir: "docs"
site_author: "건물관리자"
site_description: "공사업자용 건물 공사 관리 규정 매뉴얼"
repo_name: "manual"
repo_url: "https://example.com"
edit_uri: ""

theme:
  name: "material"
  language: "ko"
  logo: "assets/images/logo.svg"
  font:
    text: "Noto Sans KR, Apple SD Gothic Neo, sans-serif"
    code: "JetBrains Mono, monospace"
  palette:
    scheme: default
    primary: indigo
    accent: teal
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - search.highlight
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

extra_css:
  - "assets/stylesheets/custom.css"

nav:
  - "🏠 홈": index.md
  - "⚡ 퀵스타트": quickstart.md
  - "📝 공사 전":
    - 공사 신청: topics/application.md
    - 출입 절차: topics/access-control.md
    - 주차 규정: topics/parking.md
  - "🔧 공사 중":
    - 화물승강기 이용: topics/freight-elevator.md
    - 보양 규정: topics/protection-work.md
    - 안전관리 규정: topics/safety.md
    - 시설물 이용 방법: topics/facility-usage.md
  - "✅ 공사 후":
    - 폐기물 처리: topics/waste-disposal.md
    - 원상복구 기준: topics/restoration.md
    - 공사 완료 신고: topics/completion.md
  - "📚 참조":
    - 역할 및 책임: reference/roles.md
    - 위반 제재 규정: reference/violations.md
    - 용어 정리: reference/glossary.md
